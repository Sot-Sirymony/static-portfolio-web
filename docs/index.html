<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <title>Sot Sirymony - Software Developer</title> -->

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

  <style>
    /**
    .nav-link {
      position: relative;
      transition: color 0.3s;
    }
    
    .nav-link::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: 0;

      background: #00e6e6;

    **/
    .navbar .nav-link {
      color: #fff !important;
      position: relative;
      transition: color 0.3s;
    }
    
    .navbar .nav-link::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: 0;
      left: 0;
      background: #00e6e6;
      transition: width 0.3s ease;
    }
    
    .navbar .nav-link:hover::after {
      width: 100%;
    }
    
    
    /* Background */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(ellipse at center, #0d0d2b 0%, #000000 100%);
    }

    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      background: url('https://images.unsplash.com/photo-1611262588024-b6f54e371b2d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
      background-size: cover;
      z-index: -2;
      animation: moveStars 200s linear infinite;
    }

    @keyframes moveStars {
      from { background-position: 0 0; }
      to { background-position: -10000px 10000px; }
    }

    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    /* Text Glow */
    h1 {
      font-size: 3em;
      animation: glow 2s ease-in-out infinite alternate;
      margin-top: 100px;
    }

    p {
      font-size: 1.5em;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #00e6e6, 0 0 10px #00e6e6, 0 0 15px #00ffff;
      }
      to {
        text-shadow: 0 0 10px #1ecbe1, 0 0 20px #1ecbe1, 0 0 25px #00ffff;
      }
    }

    /* Contact Button */
    .contact-btn {
      margin-top: 40px;
      padding: 15px 30px;
      background: linear-gradient(45deg, #00e6e6, #1ecbe1);
      color: #000;
      border: none;
      border-radius: 30px;
      font-size: 1.2em;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      animation: pulse 2s infinite;
    }

    .contact-btn:hover {
      transform: scale(1.1);
      background: linear-gradient(45deg, #1ecbe1, #00e6e6);
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 230, 230, 0.7);
      }
      70% {
        box-shadow: 0 0 0 20px rgba(0, 230, 230, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(0, 230, 230, 0);
      }
    }

    /* Navbar override to fit theme */
    .navbar {
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    .navbar-brand,
    .nav-link {
      color: #fff !important;
      font-weight: bold;
    }

    .nav-link:hover {
      color: #00e6e6 !important;
    }
  </style>
</head>
<body>
  <!-- Background layers -->
  <div class="stars"></div>
  <div class="overlay"></div>

  <!-- Bootstrap Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid justify-content-center px-4">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon bg-light rounded"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
          <!-- Optional additional nav items -->
          <!-- <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="https://t.me/mony_john" target="_blank">Contact</a></li> -->
        </ul>
      </div>
    </div>
  </nav>
  

  <!-- Main Content -->
  <h1>Sot Sirymony</h1>
  <p>I'm a Software Developer</p>
  <a href="https://t.me/mony_john" target="_blank">
    <button class="contact-btn">Contact Me on Telegram</button>
  </a>
</body>
</html>
